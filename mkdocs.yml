site_name: Serialization
site_description: Links to GLD.SerializerBenchmark and the Mojo 1.1 gld-* serialization libraries.
site_url: https://leo-gan.github.io/serialization/
repo_url: https://github.com/leo-gan/serialization
repo_name: leo-gan/serialization
copyright: Copyright &copy; 2026 Leonid Ganeline

extra_css:
  - stylesheets/extra.css

strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Overview: index.md
  - Theory: https://leo-gan.github.io/GLD.SerializerBenchmark/theory
  - Standards: serialization/standards.md
