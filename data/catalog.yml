    type: schema-less
  - id: bson
    name: BSON
    type: schema-less
  - id: ion
    name: Amazon Ion
    type: schema-less
  - id: smile
    name: Smile
    type: schema-less
  - id: kiln
    name: Kiln
    type: schema
  - id: protobuf
    name: Protocol Buffers
    type: schema
  - id: avro
    name: Apache Avro
    type: schema
  - id: flatbuffers
    name: FlatBuffers
    type: schema
  - id: arrow
    name: Apache Arrow
    type: schema
  - id: parquet
    name: Apache Parquet
    type: schema
  - id: hdf5
    name: HDF5
    type: schema
  - id: netcdf
