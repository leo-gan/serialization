# Names, serializer types, and URLs. The pages render from this file.

benchmark:
  name: GLD.SerializerBenchmark
  repository: https://github.com/leo-gan/GLD.SerializerBenchmark
  site: https://leo-gan.github.io/GLD.SerializerBenchmark/
  dashboard: https://leo-gan.github.io/GLD.SerializerBenchmark/dashboard/

standards:
  - id: json
    name: JSON
    type: schema-less
  - id: yaml
    name: YAML
    type: schema-less
  - id: toml
    name: TOML
    type: schema-less
  - id: cbor
    name: CBOR
    type: schema-less
  - id: messagepack
