# Names, serializer types, and URLs. The pages render from this file.

benchmark:
  name: GLD.SerializerBenchmark
  repository: https://github.com/leo-gan/GLD.SerializerBenchmark
  site: https://leo-gan.github.io/GLD.SerializerBenchmark/
  dashboard: https://leo-gan.github.io/GLD.SerializerBenchmark/dashboard/

standards:
  - id: json
    name: JSON
    type: schema-less
  - id: yaml
    name: YAML
    type: schema-less
  - id: toml
    name: TOML
    type: schema-less
  - id: cbor
    name: CBOR
    type: schema-less
  - id: messagepack
    name: MessagePack
    type: schema-less
  - id: bson
    name: BSON
    type: schema-less
  - id: ion
    name: Amazon Ion
    type: schema-less
  - id: smile
    name: Smile
    type: schema-less
  - id: protobuf
    name: Protocol Buffers
    type: schema
  - id: avro
    name: Apache Avro
    type: schema
  - id: flatbuffers
    name: FlatBuffers
    type: schema
  - id: arrow
    name: Apache Arrow
    type: schema

libraries:
  - id: gld-arrow
    name: gld-arrow
    standard: arrow
    repository: https://github.com/leo-gan/gld-arrow
    documentation: https://leo-gan.github.io/gld-arrow/
  - id: gld-avro
    name: gld-avro
    standard: avro
    repository: https://github.com/leo-gan/gld-avro
    documentation: https://leo-gan.github.io/gld-avro/
  - id: gld-bson
    name: gld-bson
    standard: bson
    repository: https://github.com/leo-gan/gld-bson
    documentation: https://leo-gan.github.io/gld-bson/
  - id: gld-cbor
    name: gld-cbor
    standard: cbor
    repository: https://github.com/leo-gan/gld-cbor
    documentation: https://leo-gan.github.io/gld-cbor/
  - id: gld-flatbuffers
    name: gld-flatbuffers
    standard: flatbuffers
    repository: https://github.com/leo-gan/gld-flatbuffers
    documentation: https://leo-gan.github.io/gld-flatbuffers/
  - id: gld-ion
    name: gld-ion
    standard: ion
    repository: https://github.com/leo-gan/gld-ion
    documentation: https://leo-gan.github.io/gld-ion/
  - id: gld-json
    name: gld-json
    standard: json
    repository: https://github.com/leo-gan/gld-json
    documentation: https://leo-gan.github.io/gld-json/
  - id: gld-messagepack
    name: gld-messagepack
    standard: messagepack
    repository: https://github.com/leo-gan/gld-messagepack
    documentation: https://leo-gan.github.io/gld-messagepack/
  - id: gld-protobuf
    name: gld-protobuf
    standard: protobuf
    repository: https://github.com/leo-gan/gld-protobuf
    documentation: https://leo-gan.github.io/gld-protobuf/
  - id: gld-smile
    name: gld-smile
    standard: smile
    repository: https://github.com/leo-gan/gld-smile
    documentation: https://leo-gan.github.io/gld-smile/
  - id: gld-toml
    name: gld-toml
    standard: toml
    repository: https://github.com/leo-gan/gld-toml
    documentation: https://leo-gan.github.io/gld-toml/
  - id: gld-yaml
    name: gld-yaml
    standard: yaml
    repository: https://github.com/leo-gan/gld-yaml
    documentation: https://leo-gan.github.io/gld-yaml/
